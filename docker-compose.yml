services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: ./todo-server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/todo?schema=public
      JWT_SECRET: change-me
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: http://localhost:3000
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./todo-client
      args:
        # The browser calls the API directly, so this must be reachable from the host, not from the container
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
